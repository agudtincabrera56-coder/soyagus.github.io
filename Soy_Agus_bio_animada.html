<title>Soy Agus FF | Mis redes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;padding:30px 16px 44px;position:relative;background:radial-gradient(circle at 50% 8%,rgba(255,30,30,.16),transparent 32%),linear-gradient(145deg,#050505,#111 55%,#050505)}
body:before,body:after{content:"";position:fixed;inset:-120px 0 0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(255,35,35,.55) 0 1px,transparent 1.5px);background-size:95px 120px,145px 170px;background-position:15px -20px,70px 0;animation:fall 15s linear infinite;opacity:.32}
body:after{animation-duration:22s;animation-delay:-8s;opacity:.18}
@keyframes fall{from{transform:translateY(-80px)}to{transform:translateY(190px)}}
.page{width:min(100%,500px);text-align:center;position:relative;z-index:1}
.avatar{width:132px;height:132px;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 4px #e50914,0 0 30px rgba(229,9,20,.32);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
h1{margin:19px 0 4px;font-size:38px;line-height:1.05}
.handle{margin:0 0 10px;color:#ff3333;font-weight:800;font-size:19px}
.bio{margin:0 auto 27px;color:#d5d5d5;font-size:17px;line-height:1.45}
.links{display:grid;gap:15px}
.link{display:flex;align-items:center;justify-content:center;min-height:72px;padding:14px 22px;border-radius:15px;background:rgba(20,20,20,.91);border:1px solid rgba(255,255,255,.15);color:#fff;text-decoration:none;font-weight:800;font-size:20px;box-shadow:0 8px 22px rgba(0,0,0,.32);transition:.2s;position:relative;overflow:hidden}
.link:hover{transform:translateY(-3px);border-color:rgba(229,9,20,.8);background:#191919}
.icon{width:42px;height:42px;display:grid;place-items:center;margin-right:12px;border-radius:12px;font-size:23px;background:rgba(255,255,255,.06);animation:iconFloat 3.2s ease-in-out infinite}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px) rotate(1deg)}}
.youtube .icon{color:#f00}.tiktok .icon{color:#fff}.facebook .icon{color:#1877f2}.instagram .icon{color:#ff3b7a}
.footer{margin-top:28px;color:#777;font-size:13px}
@media(max-width:430px){h1{font-size:34px}.link{font-size:19px;min-height:68px}}
</style>
